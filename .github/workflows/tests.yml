name: tests

# Runs the pipeline guards (tests/test_pipeline.py) on every push and PR:
# every upload unique, titles within YouTube limits, every theme configured,
# crons mapped to slots, upload retries, per-upload thumbnails. Fast (~1 min),
# no secrets, renders nothing to YouTube.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest pyyaml
          # Ubuntu's mirrors occasionally fail to resolve (Nov 11 cost two uploads):
          # retry each download, and the whole install up to 3 times.
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 \
              && sudo apt-get install -y -o Acquire::Retries=5 fonts-dejavu-core fonts-dejavu-extra \
              && break
            [ "$i" = 3 ] && exit 1
            echo "apt failed (attempt $i); retrying in 60 s"; sleep 60
          done

      - name: Run tests
        run: python -m pytest -q tests
