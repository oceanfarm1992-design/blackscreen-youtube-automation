name: daily-produce-aether

# Produces "Aether & Ash" videos, ONE per run, spread across the day so runs
# never overlap. 1 feature (14:30, 1920x1080, real procedurally-animated
# visual -- see aether/make_animated_video.py) + 1 Short (59s, 1080x1920)
# per day.
#
# The 2 runs fire 12h apart. Each cron maps to a "slot" 0..1 (see
# aether/produce.py --slot): slot 0 = the feature, slot 1 = the Short.
# Musics rotate through the whole theme library in a continuous cycle. Runs
# on a PUBLIC repo so standard-runner minutes are free and unmetered.
#
# Scheduled on ODD hours so this never overlaps the "Meditated Sleeping"
# channel's daily-produce workflow (which uses even hours only).
#
# YouTube quota: 10,000 units/day. 1 feature + 1 short/day = 1*(1600+50) +
# 1*1600 + 50 playlist-add ~= 3,300 / 10,000 -- very comfortable headroom on
# a single OAuth project.
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If
# present, the day's videos are uploaded to the Aether & Ash channel as
# PUBLIC. Without them, the assets are produced and saved as run artifacts
# only. Use the workflow_dispatch "privacy" input to override to
# private/unlisted for a manual run.
#   AETHER_YT_CLIENT_ID, AETHER_YT_CLIENT_SECRET, AETHER_YT_REFRESH_TOKEN

on:
  schedule:
    - cron: "0 5 * * *"     # slot 0   05:00 UTC  feature (14:30)
    - cron: "0 17 * * *"    # slot 1   17:00 UTC  short
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload visibility: private | unlisted | public"
        default: "public"
      shorts:
        description: "Test only: number of Shorts (0 = full daily batch)"
        default: "0"
      hours:
        description: "Test only: feature length in hours (blank = today's 3/8/10h rotation)"
        default: ""
      upload:
        description: "Test only: 'false' renders + QCs without uploading (see the run's artifacts)"
        default: "true"
      longs:
        description: "Test only: number of features (0 = full daily batch)"
        default: "0"

# Least privilege: the auto-injected GITHUB_TOKEN only ever needs to read the
# repo (checkout). Uploads use the AETHER_YT_* secrets, not this token.
permissions:
  contents: read

# One production run at a time so two runs can never render/upload
# simultaneously. Separate group from the sibling channel's "daily-produce"
# so the two channels never block each other.
concurrency:
  group: daily-produce-aether
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    # Hours-long features render a fresh 1h animation (~70 min) before looping it.
    timeout-minutes: 330
    env:
      AETHER_YT_CLIENT_ID: ${{ secrets.AETHER_YT_CLIENT_ID }}
      AETHER_YT_CLIENT_SECRET: ${{ secrets.AETHER_YT_CLIENT_SECRET }}
      AETHER_YT_REFRESH_TOKEN: ${{ secrets.AETHER_YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - name: Map schedule -> slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 5 * * *")   echo "slot=0" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * *")  echo "slot=1" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=" >> "$GITHUB_OUTPUT" ;;
          esac
          # GitHub often starts crons hours late -- sometimes past midnight UTC.
          # Pin each scheduled run to the day it was SCHEDULED for, so a late
          # run never repeats the next day's video or skips its own.
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ]; then
            HOUR=$(echo "$SCHED" | awk '{print $2}')
            if [ "$(date -u +%-H)" -lt "$HOUR" ]; then
              echo "date=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"
            else
              echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Produce video(s) + QC
        # Inputs arrive as env vars -- never pasted into the script text -- so a
        # crafted workflow_dispatch value can't inject shell commands.
        env:
          SHORTS: ${{ github.event.inputs.shorts || 0 }}
          LONGS: ${{ github.event.inputs.longs || 0 }}
          SLOT: ${{ steps.slot.outputs.slot }}
          RUN_DATE: ${{ steps.slot.outputs.date }}
          RUN_ID: ${{ github.run_id }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          for n in "$SHORTS" "$LONGS" "$HOURS"; do
            case "$n" in *[!0-9]*) echo "shorts/longs/hours must be whole numbers"; exit 1 ;; esac
          done
          # Manual/test runs draw from their own seed range, so they can never
          # re-render a scheduled day's video.
          MANUAL_SEED=$(( RUN_ID % 1000000000 ))
          if [ "$SHORTS" != "0" ] || [ "$LONGS" != "0" ]; then
            echo "Manual test batch: $LONGS feature(s) + $SHORTS short(s)"
            python aether/produce.py --shorts "$SHORTS" --longs "$LONGS" --seed "$MANUAL_SEED" ${HOURS:+--hours "$HOURS"} --out-dir out
          elif [ -n "$SLOT" ]; then
            echo "Scheduled slot $SLOT"
            python aether/produce.py --slot "$SLOT" --date "$RUN_DATE" --out-dir out
          else
            echo "Manual full daily batch"
            python aether/produce.py --daily --seed "$MANUAL_SEED" --out-dir out
          fi

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do echo "--- $m ---"; cat "$m"; echo; done

      - name: Upload to YouTube (only if secrets are set)
        if: ${{ (env.AETHER_YT_REFRESH_TOKEN != '') && github.event.inputs.upload != 'false' }}
        env:
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python aether/publish_queue.py --out-dir out --privacy "$PRIVACY"

      - name: Upload metadata, manifests + thumbnails as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-aether-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
            out/*_thumb.png
          retention-days: 14
