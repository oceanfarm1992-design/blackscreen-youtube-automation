name: backfill-thumbnails

# Give a channel's existing feature videos their custom thumbnails (e.g. after
# the channel is phone-verified -- features uploaded before that show an
# auto-picked frame). Dry run by default: lists what would change and saves the
# rendered thumbnails as an artifact. Re-run with apply=true to set them.
# See scripts/backfill_thumbnails.py.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel folder"
        type: choice
        options: [aether, hearth, sanctuary, horizon, resonance, manor]
      apply:
        description: "true = set the thumbnails on YouTube; false = dry run"
        type: choice
        options: ["false", "true"]
        default: "false"
      video_id:
        description: "Optional: only this video id"
        default: ""

permissions:
  contents: read

concurrency:
  group: backfill-thumbnails-${{ github.event.inputs.channel }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One OAuth client (one Cloud project) for every channel -- YouTube API policy.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      AETHER_YT_REFRESH_TOKEN: ${{ secrets.AETHER_YT_REFRESH_TOKEN }}
      HEARTH_YT_REFRESH_TOKEN: ${{ secrets.HEARTH_YT_REFRESH_TOKEN }}
      SANCTUARY_YT_REFRESH_TOKEN: ${{ secrets.SANCTUARY_YT_REFRESH_TOKEN }}
      HORIZON_YT_REFRESH_TOKEN: ${{ secrets.HORIZON_YT_REFRESH_TOKEN }}
      RESONANCE_YT_REFRESH_TOKEN: ${{ secrets.RESONANCE_YT_REFRESH_TOKEN }}
      MANOR_YT_REFRESH_TOKEN: ${{ secrets.MANOR_YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra

      - name: Backfill thumbnails
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          APPLY: ${{ github.event.inputs.apply }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: |
          ARGS=(--channel "$CHANNEL")
          [ "$APPLY" = "true" ] && ARGS+=(--apply)
          [ -n "$VIDEO_ID" ] && ARGS+=(--video-id "$VIDEO_ID")
          python scripts/backfill_thumbnails.py "${ARGS[@]}"

      - name: Save rendered thumbnails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thumbnails-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: out_thumbs/*.png
          retention-days: 14
