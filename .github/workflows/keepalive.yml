name: keepalive

# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity -- every channel would silently stop publishing. Once a
# month this re-enables each scheduled workflow and, only if nobody has
# committed for 45+ days, pushes an empty commit (repository activity, which
# resets GitHub's 60-day timer).

on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # the empty keepalive commit
  actions: write    # re-enabling workflows

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in .github/workflows/*.yml; do
            if grep -q "^  schedule:" "$wf"; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$(basename "$wf")/enable"
              echo "enabled $(basename "$wf")"
            fi
          done

      - name: Empty commit if the repo has been quiet for 45+ days
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit was $age_days day(s) ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (no commits for $age_days days)"
            git push
          fi
