name: daily-produce

# Produces the day's batch for "Meditated Sleeping" and queues it:
#   - 3 different musics per day, each as a 12h long-form (1920x1080, #0D0D0D)
#   - 3 matching 59s Shorts (vertical 1080x1920, #0D0D0D) for better reach
#   -> 6 assets/day. All use the same black branded thumbnail.
# Musics rotate daily through the whole library (rain, waterfall, forest,
# sleeping, indian, romantic, romantic_night) based on the date.
# Runs on a PUBLIC repo so standard-runner minutes are free and unmetered.
#
# YouTube quota: the Data API default is 10,000 units/day and each upload costs
# 1,600 units. 6 uploads/day = 9,600 units, within the free quota. (Raise
# DAILY_COUNT in themes.py only after a quota increase, or uploads will fail.)
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If present,
# the day's videos are uploaded to the channel as PUBLIC. Without them, the assets
# are produced and saved as run artifacts only. Use the workflow_dispatch "privacy"
# input to override to private/unlisted for a manual run.
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN  - from the one-time OAuth setup

on:
  schedule:
    - cron: "0 6 * * *"    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Long-form length in hours (8-12)"
        default: "12"
      privacy:
        description: "Upload visibility: private | unlisted | public"
        default: "public"
      shorts:
        description: "Test only: number of Shorts (0 = full daily batch)"
        default: "0"
      longs:
        description: "Test only: number of 12h long-forms (0 = full daily batch)"
        default: "0"

# One production run at a time so a slow long-form render can't overlap the next day.
concurrency:
  group: daily-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Produce videos + QC (full daily batch, or a custom test batch)
        run: |
          SHORTS="${{ github.event.inputs.shorts || 0 }}"
          LONGS="${{ github.event.inputs.longs || 0 }}"
          HOURS="${{ github.event.inputs.hours || 12 }}"
          if [ "$SHORTS" != "0" ] || [ "$LONGS" != "0" ]; then
            echo "Test batch: $LONGS long(s) + $SHORTS short(s)"
            python scripts/produce.py --shorts "$SHORTS" --longs "$LONGS" \
              --hours "$HOURS" --out-dir out
          else
            python scripts/produce.py --daily --hours "$HOURS" --out-dir out
          fi

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do echo "--- $m ---"; cat "$m"; echo; done

      - name: Upload to YouTube as PUBLIC (only if secrets are set)
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: |
          python scripts/publish_queue.py --out-dir out --privacy "${{ github.event.inputs.privacy || 'public' }}"

      - name: Upload metadata + manifests as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
          retention-days: 14
