name: daily-produce

# Produces the day's two videos for "Meditated Sleeping" and queues them:
#   - one 59s Short  (vertical 1080x1920, #0D0D0D branded)
#   - one 8-12h long-form (1920x1080, #0D0D0D branded)
# Theme rotates daily (rain -> waterfall -> forest -> sleeping) based on the date.
# Runs on a PUBLIC repo so standard-runner minutes are free and unmetered.
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If present,
# both videos are uploaded to the channel as PRIVATE (queued) — nothing goes public
# automatically. Without them, the assets are produced and saved as run artifacts.
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN  - from the one-time OAuth setup

on:
  schedule:
    - cron: "0 6 * * *"    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Long-form length in hours (8-12)"
        default: "10"

# One production run at a time so a slow long-form render can't overlap the next day.
concurrency:
  group: daily-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Produce both videos (today's theme) + QC
        run: |
          python scripts/produce.py --format both --hours "${{ github.event.inputs.hours || 10 }}" --out-dir out

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do echo "--- $m ---"; cat "$m"; echo; done

      - name: Queue to YouTube as PRIVATE (only if secrets are set)
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: |
          python scripts/publish_queue.py --out-dir out --privacy private

      - name: Upload metadata + manifests as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
          retention-days: 14
