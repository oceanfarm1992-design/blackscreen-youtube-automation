name: daily-produce

# Produces "Meditated Sleeping" videos, ONE per run, spread across the day so runs
# never overlap. 12 assets/day = 6 long-forms (10h, 1920x1080) + 6 Shorts (59s,
# 1080x1920), on the black #0D0D0D branded frame.
#
# The 12 runs fire every 2h, alternating long/short. Each cron maps to a "slot"
# 0..11: slots 0-5 = long-forms, slots 6-11 = the Shorts (see produce.py --slot).
# Musics rotate through the whole theme library in a continuous cycle (each
# video takes the next theme; wraps to the start after the last), so every
# day's 12 videos are distinct. Runs on a PUBLIC repo so standard-runner
# minutes are free and unmetered.
#
# YouTube quota: 10,000 units/day PER Cloud project; upload = 1,600, thumbnail = 50,
# playlist add = 50. Uploads are split across TWO projects so neither is exceeded:
#   - Long-forms -> main project:      6 * (1600 + 50)      = 9,900 / 10,000 (TIGHT)
#   - Shorts     -> YT_SHORTS project: 6 * 1600 + 6 * 50    = 9,905 / 10,000
#     (the +6*50 is the auto-playlist adds for the day's long-forms, routed
#      through the YT_SHORTS project because it has the headroom)
# publish_queue.py routes each upload by format. (Change LONGS/SHORTS_PER_DAY in
# themes.py with care -- keep each project's daily total under 10,000.)
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If present,
# the day's videos are uploaded to the channel as PUBLIC. Without them, the assets
# are produced and saved as run artifacts only. Use the workflow_dispatch "privacy"
# input to override to private/unlisted for a manual run.
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN        - main OAuth project (longs)
#   YT_SHORTS_CLIENT_ID, YT_SHORTS_CLIENT_SECRET,
#   YT_SHORTS_REFRESH_TOKEN                                 - 2nd OAuth project (Shorts).
#     If absent, Shorts fall back to the main project (watch the combined quota).

on:
  schedule:
    - cron: "0 0 * * *"     # slot 0   00:00 UTC  long
    - cron: "0 2 * * *"     # slot 6   02:00 UTC  short
    - cron: "0 4 * * *"     # slot 1   04:00 UTC  long
    - cron: "0 6 * * *"     # slot 7   06:00 UTC  short
    - cron: "0 8 * * *"     # slot 2   08:00 UTC  long
    - cron: "0 10 * * *"    # slot 8   10:00 UTC  short
    - cron: "0 12 * * *"    # slot 3   12:00 UTC  long
    - cron: "0 14 * * *"    # slot 9   14:00 UTC  short
    - cron: "0 16 * * *"    # slot 4   16:00 UTC  long
    - cron: "0 18 * * *"    # slot 10  18:00 UTC  short
    - cron: "0 20 * * *"    # slot 5   20:00 UTC  long
    - cron: "0 22 * * *"    # slot 11  22:00 UTC  short
  workflow_dispatch:
    inputs:
      hours:
        description: "Long-form length override (blank = per-theme: combos 3h, solo freq 8h, nature 10h)"
        default: ""
      privacy:
        description: "Upload visibility: private | unlisted | public"
        default: "public"
      shorts:
        description: "Test only: number of Shorts (0 = full daily batch)"
        default: "0"
      longs:
        description: "Test only: number of long-forms (0 = full daily batch)"
        default: "0"

# Least privilege: the auto-injected GITHUB_TOKEN only ever needs to read the
# repo (checkout). Uploads use the YT_* secrets, not this token.
permissions:
  contents: read

# One production run at a time so two runs can never render/upload simultaneously.
concurrency:
  group: daily-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_SHORTS_CLIENT_ID: ${{ secrets.YT_SHORTS_CLIENT_ID }}
      YT_SHORTS_CLIENT_SECRET: ${{ secrets.YT_SHORTS_CLIENT_SECRET }}
      YT_SHORTS_REFRESH_TOKEN: ${{ secrets.YT_SHORTS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Map schedule -> slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")   echo "slot=0" >> "$GITHUB_OUTPUT" ;;
            "0 4 * * *")   echo "slot=1" >> "$GITHUB_OUTPUT" ;;
            "0 8 * * *")   echo "slot=2" >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *")  echo "slot=3" >> "$GITHUB_OUTPUT" ;;
            "0 16 * * *")  echo "slot=4" >> "$GITHUB_OUTPUT" ;;
            "0 20 * * *")  echo "slot=5" >> "$GITHUB_OUTPUT" ;;
            "0 2 * * *")   echo "slot=6" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * *")   echo "slot=7" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * *")  echo "slot=8" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * *")  echo "slot=9" >> "$GITHUB_OUTPUT" ;;
            "0 18 * * *")  echo "slot=10" >> "$GITHUB_OUTPUT" ;;
            "0 22 * * *")  echo "slot=11" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Produce video(s) + QC
        run: |
          SHORTS="${{ github.event.inputs.shorts || 0 }}"
          LONGS="${{ github.event.inputs.longs || 0 }}"
          SLOT="${{ steps.slot.outputs.slot }}"
          HOURS="${{ github.event.inputs.hours }}"
          # Blank HOURS -> omit --hours so produce.py uses the per-theme duration
          # map (combos 3h, solo frequencies 8h, nature/music 10h).
          HOURS_ARG=""
          [ -n "$HOURS" ] && HOURS_ARG="--hours $HOURS"
          if [ "$SHORTS" != "0" ] || [ "$LONGS" != "0" ]; then
            echo "Manual test batch: $LONGS long(s) + $SHORTS short(s)"
            python scripts/produce.py --shorts "$SHORTS" --longs "$LONGS" \
              $HOURS_ARG --out-dir out
          elif [ -n "$SLOT" ]; then
            echo "Scheduled slot $SLOT"
            python scripts/produce.py --slot "$SLOT" $HOURS_ARG --out-dir out
          else
            echo "Manual full daily batch"
            python scripts/produce.py --daily $HOURS_ARG --out-dir out
          fi

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do echo "--- $m ---"; cat "$m"; echo; done

      - name: Upload to YouTube as PUBLIC (only if secrets are set)
        if: ${{ env.YT_REFRESH_TOKEN != '' || env.YT_SHORTS_REFRESH_TOKEN != '' }}
        run: |
          python scripts/publish_queue.py --out-dir out --privacy "${{ github.event.inputs.privacy || 'public' }}"

      - name: Upload metadata + manifests as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
          retention-days: 14
