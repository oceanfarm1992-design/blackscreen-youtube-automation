name: daily-produce

# Produces "Meditated Sleeping" videos, ONE per run, spread across the day so runs
# never overlap. 6 assets/day = 3 musics x (10h long-form 1920x1080 + 59s Short
# 1080x1920), all on the same black #0D0D0D branded frame + thumbnail.
#
# The 6 runs fire ~3.8h apart (00:00, 03:48, 07:36, 11:24, 15:12, 19:00 UTC). Each
# cron maps to a "slot" 0..5: slot//2 = which music, even=long / odd=short.
# Musics rotate daily through the whole library (rain, waterfall, forest, sleeping,
# indian, romantic, romantic_night) based on the date.
# Runs on a PUBLIC repo so standard-runner minutes are free and unmetered.
#
# YouTube quota: the Data API default is 10,000 units/day and each upload costs
# 1,600 units. 6 uploads/day = 9,600 units, within the free quota. (Raise
# DAILY_COUNT in themes.py only after a quota increase, or uploads will fail.)
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If present,
# the day's videos are uploaded to the channel as PUBLIC. Without them, the assets
# are produced and saved as run artifacts only. Use the workflow_dispatch "privacy"
# input to override to private/unlisted for a manual run.
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN  - from the one-time OAuth setup

on:
  schedule:
    - cron: "0 0 * * *"     # slot 0  00:00 UTC
    - cron: "48 3 * * *"    # slot 1  03:48 UTC
    - cron: "36 7 * * *"    # slot 2  07:36 UTC
    - cron: "24 11 * * *"   # slot 3  11:24 UTC
    - cron: "12 15 * * *"   # slot 4  15:12 UTC
    - cron: "0 19 * * *"    # slot 5  19:00 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Long-form length in hours (8-12)"
        default: "10"
      privacy:
        description: "Upload visibility: private | unlisted | public"
        default: "public"
      shorts:
        description: "Test only: number of Shorts (0 = full daily batch)"
        default: "0"
      longs:
        description: "Test only: number of long-forms (0 = full daily batch)"
        default: "0"

# One production run at a time so two runs can never render/upload simultaneously.
concurrency:
  group: daily-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Map schedule -> slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")   echo "slot=0" >> "$GITHUB_OUTPUT" ;;
            "48 3 * * *")  echo "slot=1" >> "$GITHUB_OUTPUT" ;;
            "36 7 * * *")  echo "slot=2" >> "$GITHUB_OUTPUT" ;;
            "24 11 * * *") echo "slot=3" >> "$GITHUB_OUTPUT" ;;
            "12 15 * * *") echo "slot=4" >> "$GITHUB_OUTPUT" ;;
            "0 19 * * *")  echo "slot=5" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Produce video(s) + QC
        run: |
          SHORTS="${{ github.event.inputs.shorts || 0 }}"
          LONGS="${{ github.event.inputs.longs || 0 }}"
          SLOT="${{ steps.slot.outputs.slot }}"
          HOURS="${{ github.event.inputs.hours || 10 }}"
          if [ "$SHORTS" != "0" ] || [ "$LONGS" != "0" ]; then
            echo "Manual test batch: $LONGS long(s) + $SHORTS short(s)"
            python scripts/produce.py --shorts "$SHORTS" --longs "$LONGS" \
              --hours "$HOURS" --out-dir out
          elif [ -n "$SLOT" ]; then
            echo "Scheduled slot $SLOT"
            python scripts/produce.py --slot "$SLOT" --hours "$HOURS" --out-dir out
          else
            echo "Manual full daily batch"
            python scripts/produce.py --daily --hours "$HOURS" --out-dir out
          fi

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do echo "--- $m ---"; cat "$m"; echo; done

      - name: Upload to YouTube as PUBLIC (only if secrets are set)
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: |
          python scripts/publish_queue.py --out-dir out --privacy "${{ github.event.inputs.privacy || 'public' }}"

      - name: Upload metadata + manifests as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
          retention-days: 14
