name: daily-produce-manor

# CADENCE (from 2026-11-01): one Short every day + one feature every 4 days,
# each on its own full theme rotation (scripts/channel_kit.py). The feature
# cron below still fires daily but exits without producing on non-feature days.
# Older per-day counts mentioned below describe the previous schedule.
#
# Produces "Moss & Manor" videos, ONE per run, spread across the day so runs
# never overlap. 1 feature (14:30, real procedural animation, 1920x1080) +
# 1 Short (59s, 1080x1920) per day.
#
# The 2 runs fire 12h apart. Each cron maps to a "slot" 0..1 (see
# manor/produce.py --slot): slot 0 = the feature, slot 1 = the Short.
# Musics rotate through the whole theme library in a continuous cycle. Runs
# on a PUBLIC repo so standard-runner minutes are free and unmetered.
#
# Scheduled on hours 10 and 22 UTC -- distinct from every other channel's
# workflow in this repo (Meditated Sleeping: 0/12, Aether & Ash: 5/17,
# Sanctuary of Sci: 2/14, Hearth & Quill: 7/19, The Static Horizon: 9/21,
# Aether Resonance: 11/23) so none of them ever collide.
#
# YouTube quota: 10,000 units/day. 1 feature + 1 short/day is comfortably
# under quota on a single OAuth project.
#
# Optional repo Secrets (Settings -> Secrets and variables -> Actions). If
# present, the day's videos are uploaded to the Moss & Manor channel as
# PUBLIC. Without them, the assets are produced and saved as run artifacts
# only. Use the workflow_dispatch "privacy" input to override to
# private/unlisted for a manual run.
#   YT_CLIENT_ID, YT_CLIENT_SECRET   (the app's ONE OAuth client, shared by all channels)
#   MANOR_YT_REFRESH_TOKEN                (this channel's own authorisation of that client)

on:
  schedule:
    - cron: "0 10 * * *"    # slot 0   10:00 UTC  feature -- feature days only (every 4 days)
    - cron: "0 22 * * *"    # slot 1   22:00 UTC  short
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload visibility: private | unlisted | public"
        default: "public"
      shorts:
        description: "Test only: number of Shorts (0 = full daily batch)"
        default: "0"
      upload:
        description: "Test only: 'false' renders + QCs without uploading (see the run's artifacts)"
        default: "true"
      longs:
        description: "Test only: number of features (0 = full daily batch)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: daily-produce-manor
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # One OAuth client (one Cloud project) for every channel -- YouTube API policy.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      MANOR_YT_REFRESH_TOKEN: ${{ secrets.MANOR_YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - name: Map schedule -> slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 10 * * *")  echo "slot=0" >> "$GITHUB_OUTPUT" ;;
            "0 22 * * *")  echo "slot=1" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=" >> "$GITHUB_OUTPUT" ;;
          esac
          # GitHub often starts crons hours late -- sometimes past midnight UTC.
          # Pin each scheduled run to the day it was SCHEDULED for, so a late
          # run never repeats the next day's video or skips its own.
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ]; then
            HOUR=$(echo "$SCHED" | awk '{print $2}')
            if [ "$(date -u +%-H)" -lt "$HOUR" ]; then
              echo "date=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"
            else
              echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ---- ACE-Step 1.5: AI music for Shorts (themes.ACESTEP_FORMATS) ----
      # Skipped for the feature slot. Every step may fail without failing the
      # run: produce.py then makes that Short's music with the synth instead.
      # Models live in a shared cache (see benchmark-ai-music.yml).
      - name: "ACE-Step: get acestep.cpp (pinned, MIT)"
        if: steps.slot.outputs.slot != '0'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ServeurpersoCom/acestep.cpp
          ref: de858d8e1a94f0e1939cf9bdd8ff7d9631953077
          submodules: recursive
          path: acestep.cpp
          persist-credentials: false

      - name: "ACE-Step: restore build"
        id: ace-build
        if: steps.slot.outputs.slot != '0'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: acestep.cpp/build
          key: acestep-cpp-build-de858d8-openblas-v1

      - name: "ACE-Step: build (first run only)"
        if: steps.slot.outputs.slot != '0'
        continue-on-error: true
        run: |
          sudo apt-get install -y libopenblas-dev   # also the runtime library
          [ -x acestep.cpp/build/ace-synth ] && exit 0
          cd acestep.cpp && mkdir -p build && cd build
          cmake .. -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j "$(nproc)" --target ace-synth

      - name: "ACE-Step: save build"
        if: steps.slot.outputs.slot != '0' && steps.ace-build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: acestep.cpp/build
          key: acestep-cpp-build-de858d8-openblas-v1

      - name: "ACE-Step: restore models"
        id: ace-models
        if: steps.slot.outputs.slot != '0'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ai-models/acestep15
          key: models-acestep15-dit-turbo-q4km-v1

      - name: "ACE-Step: download models (first run only)"
        if: steps.slot.outputs.slot != '0' && steps.ace-models.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install -q "huggingface_hub[cli]"
          mkdir -p ~/.cache/ai-models/acestep15
          for f in vae-BF16.gguf Qwen3-Embedding-0.6B-Q8_0.gguf acestep-v15-turbo-Q4_K_M.gguf; do
            hf download Serveurperso/ACE-Step-1.5-GGUF "$f" --local-dir ~/.cache/ai-models/acestep15
          done
          rm -rf ~/.cache/ai-models/acestep15/.cache

      - name: "ACE-Step: save models"
        if: steps.slot.outputs.slot != '0' && steps.ace-models.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ai-models/acestep15
          key: models-acestep15-dit-turbo-q4km-v1

      - name: "ACE-Step: enable if ready"
        if: steps.slot.outputs.slot != '0'
        continue-on-error: true
        run: |
          M=~/.cache/ai-models/acestep15
          if [ -x acestep.cpp/build/ace-synth ] && [ -f "$M/acestep-v15-turbo-Q4_K_M.gguf" ] \
             && [ -f "$M/vae-BF16.gguf" ] && [ -f "$M/Qwen3-Embedding-0.6B-Q8_0.gguf" ]; then
            echo "ACESTEP_BIN=$PWD/acestep.cpp/build/ace-synth" >> "$GITHUB_ENV"
            echo "ACESTEP_MODELS=$M" >> "$GITHUB_ENV"
            echo "ACE-Step ready: Shorts get AI music this run."
          else
            echo "::warning::ACE-Step not ready -- Shorts use the synth this run."
          fi

      - name: Produce video(s) + QC
        # Inputs arrive as env vars -- never pasted into the script text -- so a
        # crafted workflow_dispatch value can't inject shell commands.
        env:
          SHORTS: ${{ github.event.inputs.shorts || 0 }}
          LONGS: ${{ github.event.inputs.longs || 0 }}
          SLOT: ${{ steps.slot.outputs.slot }}
          RUN_DATE: ${{ steps.slot.outputs.date }}
          RUN_ID: ${{ github.run_id }}
          # Optional: a free OpenRouter model writes each upload's opening
          # description paragraph (scripts/llm_copy.py). Unset = standard text.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for n in "$SHORTS" "$LONGS"; do
            case "$n" in *[!0-9]*) echo "shorts/longs must be whole numbers"; exit 1 ;; esac
          done
          # Manual/test runs draw from their own seed range, so they can never
          # re-render a scheduled day's video.
          MANUAL_SEED=$(( RUN_ID % 1000000000 ))
          if [ "$SHORTS" != "0" ] || [ "$LONGS" != "0" ]; then
            echo "Manual test batch: $LONGS feature(s) + $SHORTS short(s)"
            python manor/produce.py --shorts "$SHORTS" --longs "$LONGS" --seed "$MANUAL_SEED" --out-dir out
          elif [ -n "$SLOT" ]; then
            echo "Scheduled slot $SLOT"
            python manor/produce.py --slot "$SLOT" --date "$RUN_DATE" --out-dir out
          else
            echo "Manual full daily batch"
            python manor/produce.py --daily --seed "$MANUAL_SEED" --out-dir out
          fi

      - name: Show queue manifests
        run: |
          for m in out/*_manifest.json; do
            [ -e "$m" ] || { echo "Nothing produced this run (not a feature day)."; break; }
            echo "--- $m ---"; cat "$m"; echo
          done

      - name: Upload to YouTube (only if secrets are set)
        if: ${{ (env.MANOR_YT_REFRESH_TOKEN != '') && github.event.inputs.upload != 'false' }}
        env:
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python manor/publish_queue.py --out-dir out --privacy "$PRIVACY"

      - name: Keep the rendered videos (test runs with upload=false)
        if: always() && github.event.inputs.upload == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: videos-manor-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*_meta.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload metadata, manifests + thumbnails as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-manor-${{ github.run_id }}
          path: |
            out/*_manifest.json
            out/*_meta.json
            out/*_thumb.png
          retention-days: 14
